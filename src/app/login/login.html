<main
  class="relative flex min-h-svh min-w-[320px] items-start justify-center overflow-x-hidden overflow-y-auto bg-[#03030d] bg-[radial-gradient(ellipse_at_50%_16%,rgba(34,30,105,0.3),transparent_38%)] px-5 pb-10 pt-[176px] font-[family-name:Inter] text-white sm:px-8"
>
  <div
    class="pointer-events-none absolute left-1/2 top-8 size-[100px] -translate-x-1/2 rounded-full bg-[linear-gradient(180deg,#1d108f_0%,#4841a0_25%,#8b87c3_50%,#4841a0_75%,#1d108f_100%)] [background-size:100%_200%] animate-circle-gradient"
    aria-hidden="true"
  ></div>

  <section class="relative z-10 w-full max-w-[420px]" aria-labelledby="login-title">
    <header class="mb-8 text-center">
      <h1 id="login-title" class="text-[30px] font-semibold tracking-[-0.045em] sm:text-[34px]">
        Bem-vindo de volta
      </h1>
      <p class="mt-2 text-sm text-white/45">RHumi</p>
    </header>

    <div class="mb-6 grid grid-cols-2 border-b border-white/[0.12]" role="tablist" aria-label="Forma de acesso">
      <button
        class="relative h-11 cursor-pointer text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a99bff]"
        [class.text-white]="loginMode() === 'email'"
        [class.text-white/45]="loginMode() !== 'email'"
        type="button"
        role="tab"
        [attr.aria-selected]="loginMode() === 'email'"
        (click)="setLoginMode('email')"
      >
        E-mail
        @if (loginMode() === 'email') {
          <span class="absolute inset-x-5 bottom-[-1px] h-0.5 rounded-full bg-[#8277ff]" aria-hidden="true"></span>
        }
      </button>
      <button
        class="relative h-11 cursor-pointer text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#a99bff]"
        [class.text-white]="loginMode() === 'code'"
        [class.text-white/45]="loginMode() !== 'code'"
        type="button"
        role="tab"
        [attr.aria-selected]="loginMode() === 'code'"
        (click)="setLoginMode('code')"
      >
        Código do colaborador
        @if (loginMode() === 'code') {
          <span class="absolute inset-x-5 bottom-[-1px] h-0.5 rounded-full bg-[#8277ff]" aria-hidden="true"></span>
        }
      </button>
    </div>

    @if (loginMode() === 'email') {
      <form class="flex w-full flex-col" (submit)="submitLogin($event)">
        <label class="mb-2 text-sm text-white/65" for="email">E-mail</label>
        <input
          class="h-12 w-full rounded-lg border border-white/[0.12] bg-white/[0.035] px-4 text-sm text-white outline-none placeholder:text-white/30 focus-visible:outline-none focus-visible:ring-0 focus:border-[#8277ff]/65"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="voce@empresa.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required
        />

        <label class="mb-2 mt-5 text-sm text-white/65" for="senha">Senha</label>
        <input
          class="h-12 w-full rounded-lg border border-white/[0.12] bg-white/[0.035] px-4 text-sm text-white outline-none placeholder:text-white/30 focus-visible:outline-none focus-visible:ring-0 focus:border-[#8277ff]/65"
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          placeholder="Sua senha"
          [value]="senha()"
          (input)="senha.set($any($event.target).value)"
          required
        />

        <button
          class="mt-6 flex h-12 w-full cursor-pointer items-center justify-center rounded-lg bg-[#665bd0] px-5 text-sm font-semibold text-white transition-colors hover:bg-[#766be0] active:scale-[0.99] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#b4abff] disabled:cursor-wait disabled:opacity-60"
          type="submit"
          [disabled]="loading()"
        >
          @if (loading()) {
            Autenticando...
          } @else {
            Entrar
          }
        </button>
      </form>
    } @else {
      <form class="flex w-full flex-col" (submit)="submitCodeLogin($event)">
        <label class="mb-2 text-sm text-white/65" for="codigo_colaborador">Código do colaborador</label>
        <input
          class="h-12 w-full rounded-lg border border-white/[0.12] bg-white/[0.035] px-4 text-lg font-semibold tracking-[0.32em] text-white outline-none placeholder:text-sm placeholder:font-normal placeholder:tracking-normal placeholder:text-white/30 focus-visible:outline-none focus-visible:ring-0 focus:border-[#8277ff]/65"
          id="codigo_colaborador"
          name="codigo_colaborador"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          maxlength="4"
          pattern="[0-9]{4}"
          placeholder="Ex.: 0042"
          [value]="codigoColaborador()"
          (input)="codigoColaborador.set($any($event.target).value.replace(/\D/g, '').slice(0, 4))"
          required
        />
        <button
          class="mt-6 flex h-12 w-full cursor-pointer items-center justify-center rounded-lg bg-[#665bd0] px-5 text-sm font-semibold text-white transition-colors hover:bg-[#766be0] active:scale-[0.99] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#b4abff] disabled:cursor-wait disabled:opacity-60"
          type="submit"
          [disabled]="loading()"
        >
          @if (loading()) {
            Autenticando...
          } @else {
            Entrar
          }
        </button>
      </form>
    }

    @if (message()) {
      <p
        class="mt-4 text-center text-sm leading-5"
        [class.text-[#82e5ba]]="isSuccess()"
        [class.text-[#ffaaaa]]="!isSuccess()"
        role="status"
      >
        {{ message() }}
      </p>
    }
  </section>
</main>
