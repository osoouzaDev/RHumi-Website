<main
  class="relative flex min-h-svh min-w-[320px] items-center justify-center overflow-y-auto bg-[#03030d] bg-[radial-gradient(ellipse_at_83%_48%,rgba(18,18,78,0.38),transparent_39%),radial-gradient(ellipse_at_18%_50%,rgba(13,13,67,0.58),transparent_45%)] px-5 py-12 font-[family-name:Inter] text-white"
  data-node-id="1:3"
>
  <div
    class="absolute left-1/2 top-[51px] size-[100px] -translate-x-1/2 rounded-full bg-[radial-gradient(circle_at_35%_30%,#aaa4ff,#5446c8_55%,#171144)] shadow-[0_0_16px_rgba(96,77,255,0.42)]"
    aria-hidden="true"
    data-node-id="36:81"
  ></div>

  <section
    class="relative z-10 flex w-full max-w-[600px] flex-col items-center"
    aria-labelledby="login-title"
  >
    <h1
      id="login-title"
      class="mb-[21px] w-full text-center font-[family-name:Jaldi] text-[clamp(36px,2.71vw,52px)] font-normal leading-[59px] tracking-[-0.07em] max-[560px]:text-[clamp(32px,8vw,44px)] max-[560px]:leading-[1.15]"
      data-node-id="258:11"
    >
      Bem vindo ao RHumi
      <span class="block text-[#555]">Seu Gestor de Recursos Humanos</span>
    </h1>

    <form class="flex w-full flex-col items-center" (submit)="submitLogin($event)" data-node-id="259:29">
      <label class="sr-only" for="email">Seu e-mail</label>
      <div class="flex h-[100px] w-full items-center rounded-[77px] bg-[#d9d9d9] px-[49px] max-[560px]:h-[76px] max-[560px]:px-8" data-node-id="259:30">
        <input
          class="w-full bg-transparent font-[family-name:Jaldi] text-[36px] leading-[61px] text-black outline-none placeholder:text-black focus-visible:ring-2 focus-visible:ring-[#5446c8] max-[560px]:text-[25px]"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          value="souzaluis.dev&#64;gmail.com"
          required
          data-node-id="259:17"
        />
      </div>
      <button
        class="mt-10 flex h-[100px] w-full cursor-pointer items-center justify-center rounded-full border border-white bg-black text-[32px] font-bold text-white transition-colors duration-150 hover:bg-[#181818] active:scale-[0.99] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#a99bff] max-[560px]:h-[76px] max-[560px]:text-[24px]"
        type="submit"
        data-node-id="259:24"
      >
        Continue com email
      </button>
      @if (message()) {
        <p class="mt-3 text-center text-[14px] text-[#d1ccff]" role="status">{{ message() }}</p>
      }
    </form>

    <div
      class="mt-[34px] text-center text-[36px] font-bold leading-[44px] max-[560px]:mt-6 max-[560px]:text-[30px]"
      aria-hidden="true"
      data-node-id="259:19"
    >
      ou
    </div>

    <button
      class="mt-10 flex h-[69px] w-[min(323px,100%)] cursor-pointer items-center justify-center rounded-[92px] border-[5px] border-[#8f8f8f] bg-[#d9d9d9] font-[family-name:Jaldi] text-[28px] leading-[47px] text-black transition-colors duration-150 hover:bg-[#ececec] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#a99bff] max-[560px]:mt-6 max-[560px]:h-[58px] max-[560px]:text-[22px]"
      type="button"
      (click)="showCodeLoginMessage()"
      data-node-id="259:28"
    >
      Código do colaborador
    </button>
  </section>
</main>
