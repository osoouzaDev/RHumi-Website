<main class="login-page" data-node-id="1:3">
  <div class="brand-orb" aria-hidden="true" data-node-id="36:81"></div>

  <section class="login-panel" aria-labelledby="login-title">
    <h1 id="login-title" data-node-id="8:57">Bem vindo ao RHumi<span>Seu Gestor de Recursos Humanos</span></h1>

    <button class="employee-code" type="button" (click)="showCodeLoginMessage()" data-node-id="7:49">
      <span data-node-id="7:50">Código do colaborador</span>
    </button>

    <div class="login-divider" aria-hidden="true" data-node-id="7:51">ou</div>

    <form class="email-login" (submit)="submitLogin($event)" data-node-id="7:48">
      <label class="visually-hidden" for="email">Seu e-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        value="souzaluis.dev@gmail.com"
        required
        data-node-id="5:8"
      />
      <button type="submit" data-node-id="7:9">Continue com email</button>
      @if (message()) {
        <p class="login-message" role="status">{{ message() }}</p>
      }
    </form>
  </section>

  <img class="hero-cube" src="/rhumi-cube.png" alt="" aria-hidden="true" data-node-id="44:87" />
</main>
