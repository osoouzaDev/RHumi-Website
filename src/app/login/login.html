<main
  class="relative flex min-h-svh min-w-[320px] overflow-hidden bg-[#03030d] bg-[radial-gradient(ellipse_at_83%_48%,rgba(18,18,78,0.38),transparent_39%),radial-gradient(ellipse_at_18%_50%,rgba(13,13,67,0.58),transparent_45%)] font-[family-name:Inter] text-white max-[560px]:overflow-y-auto"
  data-node-id="1:3"
>
  <div
    class="absolute left-1/2 top-[51px] size-[100px] -translate-x-1/2 rounded-full bg-[radial-gradient(circle_at_35%_30%,#aaa4ff,#5446c8_55%,#171144)] shadow-[0_0_16px_rgba(96,77,255,0.42)]"
    aria-hidden="true"
    data-node-id="36:81"
  ></div>

  <section
    class="relative z-10 ml-[max(24px,calc((100vw-1514px)/2))] w-[min(646px,calc(100vw-48px))] pt-[clamp(160px,28.05vh,303px)] max-[900px]:mx-auto max-[900px]:pt-[clamp(150px,21vh,240px)] max-[560px]:w-[calc(100vw-40px)] max-[560px]:pb-[50px] max-[560px]:pt-[max(132px,18vh)]"
    aria-labelledby="login-title"
  >
    <h1
      id="login-title"
      class="mb-[27px] font-[family-name:Jaldi] text-[clamp(36px,2.71vw,52px)] font-normal leading-[1.13] tracking-[-0.07em] max-[560px]:mb-6 max-[560px]:text-[clamp(32px,9vw,42px)]"
      data-node-id="8:57"
    >
      Bem vindo ao RHumi
      <span class="block">Seu Gestor de Recursos Humanos</span>
    </h1>

    <button
      class="flex min-h-[69px] w-[min(323px,100%)] cursor-pointer items-center justify-center rounded-full border border-[rgba(205,205,205,0.75)] bg-[#d9d9d9] font-[family-name:Jaldi] text-[clamp(20px,1.46vw,28px)] text-[#0a0a0a] transition-colors duration-150 hover:bg-[#ececec] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#a99bff] max-[560px]:min-h-[58px] max-[560px]:text-[22px]"
      type="button"
      (click)="showCodeLoginMessage()"
      data-node-id="7:49"
    >
      <span data-node-id="7:50">Código do colaborador</span>
    </button>

    <div
      class="my-[14px] mb-8 w-full text-center text-[28px] font-bold leading-[34px] max-[560px]:my-[10px] max-[560px]:mb-5 max-[560px]:text-[22px]"
      aria-hidden="true"
      data-node-id="7:51"
    >
      ou
    </div>

    <form class="flex flex-col gap-[27px] max-[560px]:gap-4" (submit)="submitLogin($event)" data-node-id="7:48">
      <label class="sr-only" for="email">Seu e-mail</label>
      <input
        class="min-h-[94px] w-full rounded-full border-[3px] border-white bg-white px-[38px] font-[family-name:Jaldi] text-[32px] text-[#090909] focus-visible:outline-none focus-visible:shadow-[0_0_0_4px_rgba(139,120,255,0.55)] max-[560px]:min-h-[68px] max-[560px]:px-6 max-[560px]:text-[22px]"
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        value="souzaluis.dev&#64;gmail.com"
        required
        data-node-id="5:8"
      />
      <button
        class="min-h-[94px] w-full cursor-pointer rounded-full border border-white bg-[#050505] text-[32px] font-bold text-white transition duration-150 hover:bg-[#181818] active:scale-[0.99] focus-visible:outline-3 focus-visible:outline-offset-4 focus-visible:outline-[#a99bff] max-[560px]:min-h-[68px] max-[560px]:text-[21px]"
        type="submit"
        data-node-id="7:9"
      >
        Continue com email
      </button>
      @if (message()) {
        <p class="-mt-3 mx-6 text-center text-[14px] text-[#d1ccff]" role="status">{{ message() }}</p>
      }
    </form>
  </section>

  <img
    class="absolute right-[max(24px,calc((100vw-1348px)/2))] top-[31.5%] aspect-square w-[min(400px,27vw)] object-contain max-[900px]:top-auto max-[900px]:right-1/2 max-[900px]:bottom-[-175px] max-[900px]:w-[min(320px,60vw)] max-[900px]:translate-x-1/2 max-[900px]:opacity-[0.45] max-[560px]:bottom-[-210px] max-[560px]:w-[min(270px,68vw)]"
    src="/rhumi-cube.png"
    alt=""
    aria-hidden="true"
    data-node-id="44:87"
  />
</main>
